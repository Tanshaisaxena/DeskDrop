<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173f3a">
<title>DeskDrop | Laptop files</title>
<script>
  const savedTheme = localStorage.getItem("deskdrop-theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
</script>
<style>
:root { color-scheme: light; --ink:#173f3a; --muted:#69827b; --paper:#f5f1e8; --card:#fffdf8; --panel:#173f3a; --line:#d9e0d6; --accent:#e2734e; font-family:"Trebuchet MS",sans-serif; }
:root[data-theme="dark"] { color-scheme: dark; --ink:#e5eee7; --muted:#a5bab0; --paper:#172522; --card:#21332f; --panel:#10211e; --line:#3a5149; --accent:#f08a62; }
* { box-sizing:border-box; }
body { min-height:100vh; margin:0; color:var(--ink); background:var(--paper); background-image:radial-gradient(#dbe5d7 1px,transparent 1px); background-size:18px 18px; transition:background-color .2s ease,color .2s ease; }
:root[data-theme="dark"] body { background-image:radial-gradient(#31463f 1px,transparent 1px); }
main { max-width:46rem; margin:0 auto; padding:2rem 1.1rem 3rem; }
header { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin-bottom:1.7rem; }
.header-actions { display:flex; align-items:center; gap:.6rem; }
.eyebrow { margin:0 0 .35rem; color:var(--accent); font-size:.74rem; font-weight:bold; letter-spacing:.12em; text-transform:uppercase; }
h1 { margin:0; font-family:Georgia,serif; font-size:clamp(2rem,8vw,3.4rem); line-height:1; }
.status { display:flex; align-items:center; gap:.45rem; padding:.5rem .7rem; border:1px solid var(--line); border-radius:999px; background:#eef5eb; color:#356c4d; font-size:.75rem; white-space:nowrap; }
.status::before { content:""; width:.48rem; height:.48rem; border-radius:50%; background:#4b9a62; }
.theme-toggle { display:grid; place-items:center; width:2.35rem; height:2.35rem; padding:0; border:1px solid var(--line); border-radius:50%; background:var(--card); color:var(--ink); font-size:1.1rem; }
.theme-toggle .sun { display:none; }
:root[data-theme="dark"] .theme-toggle .moon { display:none; }
:root[data-theme="dark"] .theme-toggle .sun { display:inline; }
.intro { margin:0 0 1.5rem; color:var(--muted); }
.stats { display:grid; grid-template-columns:repeat(2,1fr); gap:.8rem; margin-bottom:1.6rem; }
.stat { padding:1rem; border:1px solid var(--line); border-radius:.65rem; background:var(--card); box-shadow:0 8px 22px #3658470d; }
.stat strong { display:block; font-family:Georgia,serif; font-size:1.45rem; }
.stat span { color:var(--muted); font-size:.75rem; }
section { margin-bottom:1.6rem; }
.section-heading { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:.7rem; }
h2 { margin:0; font-size:1.1rem; }
.section-heading span { color:var(--muted); font-size:.8rem; }
.toolbar { display:flex; gap:.6rem; margin-bottom:.8rem; }
input[type=search], select { min-width:0; border:1px solid var(--line); border-radius:.4rem; padding:.65rem .7rem; background:var(--card); color:var(--ink); font:inherit; font-size:.85rem; }
input[type=search] { flex:1; }
ul { display:grid; gap:.65rem; list-style:none; padding:0; margin:0; }
.file-link { display:flex; align-items:center; gap:.8rem; min-height:4.2rem; padding:.75rem .85rem; border:1px solid var(--line); border-radius:.65rem; background:var(--card); color:var(--ink); text-decoration:none; box-shadow:0 6px 18px #3658470b; transition:transform .15s ease,border-color .15s ease; }
.file-link:hover,.file-link:focus-visible { transform:translateY(-2px); border-color:var(--accent); outline:none; }
.file-icon { display:grid; place-items:center; flex:0 0 2.65rem; height:2.65rem; border-radius:.45rem; background:#e7efe2; color:#41715c; font-size:.62rem; font-weight:bold; }
.folder-icon { background:#f8e7c9; color:#a36b2c; }
.file-details { display:flex; flex:1; min-width:0; flex-direction:column; gap:.2rem; }
.file-details strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.92rem; }
.file-details small { color:var(--muted); font-size:.75rem; }
.download-icon { color:var(--accent); font-size:1.5rem; }
.empty { padding:1.5rem; border:1px dashed #b9cabb; border-radius:.65rem; color:var(--muted); text-align:center; background:#fffdf899; }
.upload-panel { padding:1.2rem; border-radius:.7rem; background:var(--panel); color:#f8f3e9; box-shadow:0 12px 30px #173f3a24; }
.upload-panel h2 { color:#f8f3e9; }
.upload-panel p { margin:.3rem 0 1rem; color:#b9d0c3; font-size:.82rem; }
.upload-row { display:flex; flex-wrap:wrap; gap:.7rem; align-items:center; }
input[type=file] { min-width:0; flex:1; color:#dce9df; font-size:.8rem; }
button { border:0; border-radius:.4rem; padding:.7rem 1rem; background:var(--accent); color:white; cursor:pointer; font:inherit; font-size:.85rem; font-weight:bold; }
button:hover,button:focus-visible { background:#d55d3b; outline:2px solid #f7b49b; outline-offset:2px; }
#upload-status { display:none; margin-top:.8rem; color:#f7c1aa; font-size:.8rem; }
@media (max-width:420px) { header { display:block; } .status { display:inline-flex; margin-top:1rem; } .toolbar { display:grid; grid-template-columns:1fr 1fr; } .toolbar input { grid-column:1 / -1; } .upload-row { display:block; } button { width:100%; margin-top:.7rem; } }
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">Local file desk</p><h1>DeskDrop</h1></div><div class="header-actions"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><span class="moon" aria-hidden="true">&#9790;</span><span class="sun" aria-hidden="true">&#9788;</span></button><div class="status">Connected</div></div></header>
<p class="intro">Your laptop files, ready to move.</p>
<div class="stats"><div class="stat"><strong id="file-count">__FILE_COUNT__</strong><span>available files</span></div><div class="stat"><strong>__TOTAL_SIZE__</strong><span>total shared</span></div></div>
<section>
<div class="section-heading"><h2>Available files</h2><span id="visible-count">Tap to download</span></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search files..." aria-label="Search files"><select id="sort" aria-label="Sort files"><option value="name">Name A-Z</option><option value="size">Largest first</option><option value="type">File type</option></select></div>
<ul id="file-list">__FILES__</ul>
</section>
<section class="upload-panel"><h2>Send something to your laptop</h2><p>Choose a file or an entire folder from your phone. Folder structure is preserved.</p><form id="upload-form" action="/upload" method="post" enctype="multipart/form-data"><div class="upload-row"><input id="file-input" type="file" name="file"><button type="submit">Upload file</button></div><div class="upload-row folder-upload"><input id="folder-input" type="file" name="file" webkitdirectory directory multiple><button type="submit">Upload folder</button></div><div id="upload-status" role="status"></div></form></section>
</main>
<script>
const list = document.getElementById("file-list");
const items = [...list.querySelectorAll(".file-item")];
const search = document.getElementById("search");
const sort = document.getElementById("sort");
const visible = document.getElementById("visible-count");
const folderInput = document.getElementById("folder-input");
const themeToggle = document.getElementById("theme-toggle");
function updateThemeLabel() {
  const dark = document.documentElement.dataset.theme === "dark";
  themeToggle.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}
themeToggle.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  localStorage.setItem("deskdrop-theme", document.documentElement.dataset.theme);
  updateThemeLabel();
});
updateThemeLabel();
function updateFiles() {
  const query = search.value.toLowerCase().trim();
  const ordered = [...items].sort((a,b) => {
    if (sort.value === "size") return Number(b.dataset.size) - Number(a.dataset.size);
    if (sort.value === "type") return a.dataset.type.localeCompare(b.dataset.type) || a.dataset.name.localeCompare(b.dataset.name);
    return a.dataset.name.localeCompare(b.dataset.name);
  });
  ordered.forEach(item => list.appendChild(item));
  let shown = 0;
  ordered.forEach(item => { const match = item.dataset.name.includes(query); item.hidden = !match; if (match) shown++; });
  visible.textContent = shown + " file" + (shown === 1 ? "" : "s") + " shown";
}
search.addEventListener("input", updateFiles);
sort.addEventListener("change", updateFiles);
updateFiles();
document.getElementById("upload-form").addEventListener("submit", event => {
  const input = document.getElementById("file-input");
  const activeInput = event.submitter.textContent.includes("folder") ? folderInput : input;
  const status = document.getElementById("upload-status");
  if (!activeInput.files.length) { event.preventDefault(); status.style.display = "block"; status.textContent = "Choose a file or folder first."; return; }
  if (event.submitter.textContent.includes("folder")) input.removeAttribute("required");
  status.style.display = "block"; status.textContent = "Uploading " + activeInput.files.length + " item" + (activeInput.files.length === 1 ? "" : "s") + "...";
});
</script>
</body>
</html>
